<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>调试面板 - 图标画布台</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --panel: #16213e;
            --card: #1e2a47;
            --border: #2a3a5c;
            --text: #e0e0e0;
            --muted: #8892a4;
            --accent: #e94560;
            --success: #4ecca3;
            --warning: #f0c040;
            --error: #e94560;
            --info: #4ea8de;
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            font-family: "SF Mono", "Fira Code", "Consolas", monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--accent);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            transition: background 120ms, border-color 120ms;
        }

        .btn:hover {
            background: var(--border);
            border-color: var(--muted);
        }

        .btn--danger {
            border-color: var(--error);
            color: var(--error);
        }

        .btn--danger:hover {
            background: rgba(233, 69, 96, 0.15);
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--muted);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            flex: 1;
        }

        .stat-card .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .stat-card .value {
            font-size: 24px;
            font-weight: 700;
        }

        .stat-card .value.success {
            color: var(--success);
        }

        .stat-card .value.error {
            color: var(--error);
        }

        .stat-card .value.info {
            color: var(--info);
        }

        .log-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .log-entry {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .log-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            cursor: pointer;
            user-select: none;
            transition: background 100ms;
        }

        .log-header:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .log-header .arrow {
            transition: transform 200ms;
            color: var(--muted);
            font-size: 12px;
        }

        .log-entry.is-open .log-header .arrow {
            transform: rotate(90deg);
        }

        .log-time {
            font-size: 12px;
            color: var(--muted);
            min-width: 180px;
        }

        .log-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .log-badge.success {
            background: rgba(78, 204, 163, 0.15);
            color: var(--success);
        }

        .log-badge.error {
            background: rgba(233, 69, 96, 0.15);
            color: var(--error);
        }

        .log-badge.pending {
            background: rgba(240, 192, 64, 0.15);
            color: var(--warning);
        }

        .log-badge.info {
            background: rgba(78, 168, 222, 0.15);
            color: var(--info);
        }

        .log-step {
            font-size: 12px;
            font-weight: 600;
            color: var(--info);
            min-width: 140px;
        }

        .log-message {
            font-size: 13px;
            flex: 1;
        }

        .log-session {
            font-size: 11px;
            color: var(--muted);
            font-family: monospace;
        }

        .log-body {
            display: none;
            padding: 0 18px 16px;
            border-top: 1px solid var(--border);
        }

        .log-entry.is-open .log-body {
            display: block;
        }

        .log-detail {
            margin-top: 12px;
        }

        .log-detail-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .log-detail-content {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }

        .log-detail-content.analysis-text {
            font-size: 14px;
            color: var(--success);
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .back-link {
            color: var(--info);
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Session group */
        .session-group {
            margin-bottom: 24px;
        }

        .session-label {
            font-size: 12px;
            color: var(--accent);
            margin-bottom: 8px;
            padding-left: 4px;
            font-weight: 600;
            letter-spacing: 0.05em;
        }
    </style>
</head>

<body>
    <div class="header">
        <div>
            <h1>🔧 调试面板</h1>
            <a href="/" class="back-link">← 返回画布</a>
        </div>
        <div class="header-actions">
            <label class="auto-refresh">
                <input type="checkbox" id="autoRefresh" checked />
                自动刷新 (3s)
            </label>
            <button class="btn" id="refreshBtn">🔄 刷新</button>
            <button class="btn btn--danger" id="clearBtn">🗑 清空日志</button>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="label">总请求数</div>
            <div class="value info" id="statTotal">0</div>
        </div>
        <div class="stat-card">
            <div class="label">成功</div>
            <div class="value success" id="statSuccess">0</div>
        </div>
        <div class="stat-card">
            <div class="label">失败</div>
            <div class="value error" id="statError">0</div>
        </div>
        <div class="stat-card">
            <div class="label">处理中</div>
            <div class="value" id="statPending" style="color: var(--warning)">0</div>
        </div>
    </div>

    <div id="logList" class="log-list">
        <div class="empty-state">
            <div class="icon">📋</div>
            <p>暂无日志记录</p>
            <p style="font-size: 12px; margin-top: 8px;">在画布页面生成图片后，日志会显示在这里</p>
        </div>
    </div>

    <script>
        const logList = document.getElementById('logList');
        const refreshBtn = document.getElementById('refreshBtn');
        const clearBtn = document.getElementById('clearBtn');
        const autoRefreshCheckbox = document.getElementById('autoRefresh');

        const STEP_LABELS = {
            'start': '🚀 开始',
            'seed2_request': '🔍 Seed2请求',
            'seed2_response': '🔍 Seed2响应',
            'seedream_request': '🎨 Seedream请求',
            'seedream_response': '🎨 Seedream响应'
        };

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function renderLogs(logs) {
            if (!logs || logs.length === 0) {
                logList.innerHTML = '<div class="empty-state">' +
                    '<div class="icon">📋</div>' +
                    '<p>暂无日志记录</p>' +
                    '<p style="font-size: 12px; margin-top: 8px;">在画布页面生成图片后，日志会显示在这里</p>' +
                    '</div>';
                return;
            }

            // Group by sessionId
            const sessions = {};
            logs.forEach(log => {
                const sid = log.sessionId || 'unknown';
                if (!sessions[sid]) sessions[sid] = [];
                sessions[sid].push(log);
            });

            let html = '';
            for (const [sessionId, sessionLogs] of Object.entries(sessions)) {
                html += '<div class="session-group">';
                html += '<div class="session-label">会话: ' + escapeHtml(sessionId) + '</div>';

                sessionLogs.forEach(log => {
                    const stepLabel = STEP_LABELS[log.step] || log.step;
                    const badgeClass = log.status || 'info';
                    const time = new Date(log.timestamp).toLocaleString('zh-CN');

                    let bodyHtml = '';

                    if (log.userText) {
                        bodyHtml += '<div class="log-detail"><div class="log-detail-label">用户辅助文字</div>' +
                            '<div class="log-detail-content">' + escapeHtml(log.userText) + '</div></div>';
                    }

                    if (log.analysisText) {
                        bodyHtml += '<div class="log-detail"><div class="log-detail-label">Seed 2.0 分析结果 (生成的 Prompt)</div>' +
                            '<div class="log-detail-content analysis-text">' + escapeHtml(log.analysisText) + '</div></div>';
                    }

                    if (log.prompt) {
                        bodyHtml += '<div class="log-detail"><div class="log-detail-label">发送给 Seedream 的 Prompt</div>' +
                            '<div class="log-detail-content">' + escapeHtml(log.prompt) + '</div></div>';
                    }

                    if (log.seed2Model) {
                        bodyHtml += '<div class="log-detail"><div class="log-detail-label">Seed 2.0 模型</div>' +
                            '<div class="log-detail-content">' + escapeHtml(log.seed2Model) + '</div></div>';
                    }

                    if (log.rawResponse) {
                        bodyHtml += '<div class="log-detail"><div class="log-detail-label">原始 API 响应</div>' +
                            '<div class="log-detail-content">' + escapeHtml(JSON.stringify(log.rawResponse, null, 2)) + '</div></div>';
                    }

                    if (log.imagePreview) {
                        bodyHtml += '<div class="log-detail"><div class="log-detail-label">输入图片 (预览)</div>' +
                            '<div class="log-detail-content">' + escapeHtml(log.imagePreview) + '</div></div>';
                    }

                    html += '<div class="log-entry">' +
                        '<div class="log-header" onclick="this.parentElement.classList.toggle(\'is-open\')">' +
                        '<span class="arrow">▶</span>' +
                        '<span class="log-time">' + time + '</span>' +
                        '<span class="log-badge ' + badgeClass + '">' + escapeHtml(log.status) + '</span>' +
                        '<span class="log-step">' + escapeHtml(stepLabel) + '</span>' +
                        '<span class="log-message">' + escapeHtml(log.message || '') + '</span>' +
                        '</div>';

                    if (bodyHtml) {
                        html += '<div class="log-body">' + bodyHtml + '</div>';
                    }

                    html += '</div>';
                });

                html += '</div>';
            }

            logList.innerHTML = html;

            // Stats
            const total = logs.length;
            const success = logs.filter(l => l.status === 'success').length;
            const error = logs.filter(l => l.status === 'error').length;
            const pending = logs.filter(l => l.status === 'pending').length;
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statSuccess').textContent = success;
            document.getElementById('statError').textContent = error;
            document.getElementById('statPending').textContent = pending;
        }

        async function fetchLogs() {
            try {
                const resp = await fetch('/api/debug-logs');
                const data = await resp.json();
                renderLogs(data.logs || []);
            } catch (e) {
                console.error('Failed to fetch logs:', e);
            }
        }

        refreshBtn.addEventListener('click', fetchLogs);

        clearBtn.addEventListener('click', async () => {
            if (!confirm('确定要清空所有日志吗？')) return;
            await fetch('/api/debug-logs/clear');
            fetchLogs();
        });

        // Auto refresh
        let autoRefreshTimer = null;
        function startAutoRefresh() {
            stopAutoRefresh();
            if (autoRefreshCheckbox.checked) {
                autoRefreshTimer = setInterval(fetchLogs, 3000);
            }
        }
        function stopAutoRefresh() {
            if (autoRefreshTimer) {
                clearInterval(autoRefreshTimer);
                autoRefreshTimer = null;
            }
        }
        autoRefreshCheckbox.addEventListener('change', startAutoRefresh);

        // Initial load
        fetchLogs();
        startAutoRefresh();
    </script>
</body>

</html>
